name: collect-options

# Se dispara de dos formas:
#  1) Por cron, solo en horario de mercado (para no gastar minutos de más).
#  2) Manualmente (workflow_dispatch) — esto es lo que activa el botón del dashboard.
on:
  workflow_dispatch:            # botón "actualizar" del dashboard + botón manual en Actions
  schedule:
    # GitHub usa UTC. El mercado de EE.UU. abre 9:30am y cierra 4:00pm ET.
    # En horario de verano (EDT = UTC-4): 13:30–20:00 UTC.
    # Corremos cada 30 min en esa ventana, de lunes a viernes.
    # Nota: usamos minuto 3 y 33 (no 0/30) porque los minutos "redondos" están
    # saturados y GitHub los retrasa más. Ajusta a UTC-5 en invierno si hace falta.
    - cron: "3,33 13-20 * * 1-5"

# Evita que dos corridas se pisen si una se atrasa.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write               # necesario para hacer commit de options.db

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar snapshot
        run: python collect.py        # lee watchlist.txt automáticamente

      - name: Guardar la base de datos actualizada
        run: |
          git config user.name  "options-bot"
          git config user.email "bot@users.noreply.github.com"
          git add options.db
          # commitea solo si hubo cambios
          git diff --staged --quiet || git commit -m "snapshot $(date -u +'%F %H:%M UTC')"
          git push
